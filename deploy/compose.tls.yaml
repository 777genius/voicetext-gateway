services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    init: true
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      VOICETEXT_PUBLIC_HOST: ${VOICETEXT_PUBLIC_HOST:?set VOICETEXT_PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - egress
    pids_limit: 256

volumes:
  caddy-data:
  caddy-config:
