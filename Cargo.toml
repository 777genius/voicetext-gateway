[workspace]
members = [
    "crates/voicetext-audio",
    "crates/voicetext-gateway",
    "crates/voicetext-providers",
    "crates/voicetext-speech",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "multipart", "tokio", "ws"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
hex = "=0.4.3"
opus = "=0.4.0"
ogg = "=0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["serde", "v4", "v5"] }
voicetext-audio = { path = "crates/voicetext-audio", version = "=0.1.0" }
voicetext-gateway = { path = "crates/voicetext-gateway", version = "=0.1.0" }
voicetext-providers = { path = "crates/voicetext-providers", version = "=0.1.0" }
voicetext-speech = { path = "crates/voicetext-speech", version = "=0.1.0" }

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
