name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_REF: ${{ github.event.pull_request && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
    steps:
      - name: Check out the exact source head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          repository: ${{ env.SOURCE_REPOSITORY }}

      - name: Assert exact head and clean tracked tree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install pinned Rust toolchain and native build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake

      - name: Format, lint, test, and document
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo doc --workspace --no-deps --locked

      - name: Install exact Go runtime for security tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          check-latest: false

      - name: Install pinned security and policy tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          "$go_bin/gitleaks" version

      - name: Scan the tracked tree and complete history for secrets
        run: |
          tracked_tree="$RUNNER_TEMP/tracked-tree"
          mkdir -p "$tracked_tree"
          git archive "$SOURCE_SHA" | tar -x -C "$tracked_tree"
          gitleaks dir --no-banner --redact "$tracked_tree"
          gitleaks git --no-banner --redact --log-opts=--all .

      - name: Verify Rust architecture and dependency policy
        run: |
          cargo xtask verify
          cargo deny check

      - name: Verify fail-closed release evidence policy
        run: |
          sh -n scripts/create-release-evidence.sh scripts/verify-release-evidence.sh \
            scripts/run-production-composition-gate.sh scripts/test-release-evidence.sh
          scripts/test-release-evidence.sh

      - name: Validate Compose, Caddy semantics, secrets, and runtime hardening
        run: |
          docker pull caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          scripts/verify-deploy.sh

      - name: Check and build the pinned image from exact remote Git source
        run: |
          remote_context="${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}.git?ref=${SOURCE_REF}&checksum=${SOURCE_SHA}"
          docker buildx build --check "$remote_context"
          docker buildx build --target verification --progress plain "$remote_context"
          docker buildx build --target runtime --load \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "voicetext-gateway:${SOURCE_SHA}" "$remote_context"

      - name: Test portable non-root secret custody
        run: scripts/test-secret-custody.sh "voicetext-gateway:${SOURCE_SHA}"

      - name: Assert exact-head image identity and packaged license evidence
        run: |
          image="voicetext-gateway:${SOURCE_SHA}"
          docker image inspect "$image" | jq -e '
            .[0].Config.User == "10001:10001" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == env.SOURCE_SHA and
            .[0].Config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0" and
            (.[0].Config.Env | map(select(test("(TOKEN|PASSWORD|API_KEY)="))) | length == 0) and
            (.[0].Config.Healthcheck.Test | tostring | contains("VOICETEXT_HEALTHCHECK_URL"))
          '
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" --output image-rootfs.tar
          tar -xOf image-rootfs.tar usr/share/licenses/voicetext-gateway/LICENSE > image-LICENSE
          tar -xOf image-rootfs.tar usr/share/licenses/voicetext-gateway/NOTICE > image-NOTICE
          cmp LICENSE image-LICENSE
          cmp NOTICE image-NOTICE

  production-composition:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VOICETEXT_TEST_DATABASE_URL: postgresql://postgres:composition-only@127.0.0.1:5432/voicetext_test_release
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: voicetext_test_release
          POSTGRES_PASSWORD: composition-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voicetext_test_release"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          repository: ${{ env.SOURCE_REPOSITORY }}

      - name: Assert exact head and pinned TypeScript fixture
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (cd contract-fixtures/typescript-consumer && sha256sum --check SHA256SUMS)

      - name: Install exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Install pinned Rust toolchain and native build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake

      - name: Build the shipped release-mode binary
        run: cargo build --locked --release --package voicetext-gateway --bin voicetext-gateway

      - name: Run hermetic production composition and independent TypeScript contract
        env:
          VOICETEXT_GATEWAY_PRODUCTION_BINARY: ${{ github.workspace }}/target/release/voicetext-gateway
        run: scripts/run-production-composition-gate.sh

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [exact-head, production-composition]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Assert annotated release identity and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list -n 1 "$SOURCE_REF")" = "$SOURCE_SHA"
          test "$(git cat-file -t "$SOURCE_REF")" = tag
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install exact Go runtime for evidence tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          check-latest: false

      - name: Install pinned evidence tools
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.51.1
          go install github.com/anchore/grype/cmd/grype@v0.118.0
          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          "$go_bin/syft" version
          "$go_bin/grype" version

      - name: Authenticate to the release registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish exact remote source as an immutable image
        id: publish
        run: |
          image="ghcr.io/${SOURCE_REPOSITORY,,}/voicetext-gateway"
          remote_context="${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}.git?ref=${SOURCE_REF}&checksum=${SOURCE_SHA}"
          docker buildx build --target runtime --push --provenance=false \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${image}:${SOURCE_SHA}" --tag "${image}:${RELEASE_TAG}" \
            --metadata-file image-metadata.json "$remote_context"
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' image-metadata.json)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_hex=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          docker pull "${image}@${digest}"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${image}@${digest}")" = "$SOURCE_SHA"

      - name: Cryptographically attest source-to-image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Generate digest-bearing CycloneDX SBOM
        run: |
          mkdir evidence
          image='${{ steps.publish.outputs.image }}'
          digest='${{ steps.publish.outputs.digest }}'
          syft "${image}@${digest}" -o cyclonedx-json=evidence/sbom.raw.json
          jq -S --arg source_sha "$SOURCE_SHA" --arg image_digest "$digest" '
            .metadata.properties = ((.metadata.properties // []) + [
              {name: "org.opencontainers.image.revision", value: $source_sha},
              {name: "org.opencontainers.image.digest", value: $image_digest}
            ] | unique_by(.name) | sort_by(.name))
          ' evidence/sbom.raw.json > evidence/voicetext-gateway.sbom.cdx.json
          rm evidence/sbom.raw.json

      - name: Cryptographically attest the digest-bearing SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: evidence/voicetext-gateway.sbom.cdx.json
          push-to-registry: true

      - name: Apply fail-closed vulnerability policy
        run: |
          set +e
          grype sbom:evidence/voicetext-gateway.sbom.cdx.json --fail-on high \
            --output json --file evidence/vulnerabilities.grype.json
          scan_status=$?
          set -e
          test "$scan_status" -eq 0
          jq -e '
            .descriptor.name == "grype" and
            .descriptor.version == "0.118.0" and
            ([.ignoredMatches[]?] | length == 0) and
            ([.matches[]? | .vulnerability.severity]
              | map(select(. == "Critical" or . == "High")) | length == 0)
          ' evidence/vulnerabilities.grype.json >/dev/null

      - name: Inspect license and notice in the exact image digest
        run: |
          exact_image='${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}'
          container=$(docker create "$exact_image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" --output exact-image-rootfs.tar
          tar -xOf exact-image-rootfs.tar usr/share/licenses/voicetext-gateway/LICENSE > image-LICENSE
          tar -xOf exact-image-rootfs.tar usr/share/licenses/voicetext-gateway/NOTICE > image-NOTICE
          cmp LICENSE image-LICENSE
          cmp NOTICE image-NOTICE
          mkdir -p evidence/distribution
          mv image-LICENSE evidence/distribution/LICENSE
          mv image-NOTICE evidence/distribution/NOTICE

      - name: Create and verify deterministic release predicate
        run: |
          scripts/create-release-evidence.sh "$SOURCE_SHA" \
            '${{ steps.publish.outputs.image }}' '${{ steps.publish.outputs.digest }}' evidence
          scripts/verify-release-evidence.sh evidence

      - name: Cryptographically bind all release policy evidence to the image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://voicetext.dev/attestations/release-evidence/v1
          predicate-path: evidence/release-evidence.json
          push-to-registry: true

      - name: Verify registry attestations against the exact repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject='oci://${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}'
          gh attestation verify "$subject" --repo "$SOURCE_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "$subject" --repo "$SOURCE_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom
          gh attestation verify "$subject" --repo "$SOURCE_REPOSITORY" \
            --predicate-type https://voicetext.dev/attestations/release-evidence/v1

      - name: Retain digest-named exact-head evidence for the repository limit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voicetext-release-evidence-${{ env.SOURCE_SHA }}-${{ steps.publish.outputs.digest_hex }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish evidence as immutable release-lifetime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="voicetext-release-evidence-${SOURCE_SHA}-${{ steps.publish.outputs.digest_hex }}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" evidence
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes "Exact-head release awaiting human acceptance review."
          fi
          gh release upload "$RELEASE_TAG" "$archive" evidence/release-evidence.json \
            evidence/voicetext-gateway.sbom.cdx.json evidence/vulnerabilities.grype.json
